name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with flake8 (gate)
        run: |
          flake8 beast2py tests --count --max-line-length=100 --statistics

      - name: Run tests
        # -rs makes skipped tests visible: the BEAST2 integration tests in
        # test_beast2_validation.py are skipped when no BEAST.base.jar is
        # found, and a silent skip used to look like full coverage.
        run: |
          pytest tests/ -v -rs --cov=beast2py --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  integration:
    # End-to-end BEAST2 validation: installs BEAST 2.7.8 and runs the
    # integration tests (including XMLParser validation of every example
    # config) instead of silently skipping them.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install BEAST runtime (v2.7.7 tarball)
        # v2.7.8 是「纯包发布」(package-only)：其 release 只含
        # BEAST.base/app .package zip，没有任何完整运行时，官方说明为
        # "to install, install v2.7.7 and update the BEAST.base and BEAST.app
        # packages"。先前直接下载 BEAST.v2.7.8.Linux.tgz 恒为 404，
        # 导致 integration job 每次都在安装步骤失败。
        #
        # 因此这里装 v2.7.7 的 Linux 运行时（含 bin/beast 启动脚本与 JDK 17
        # 兼容性已验证），再在下一步把 BEAST.base 升到 2.7.8。
        run: |
          set -euo pipefail
          curl -fsSL -o beast.tgz \
            https://github.com/CompEvol/beast2/releases/download/v2.7.7/BEAST.v2.7.7.Linux.x86.tgz
          tar -xzf beast.tgz
          test -x beast/bin/beast || { echo "::error::tarball 结构异常，beast/bin/beast 不可执行"; ls -la beast/; exit 1; }
          # 必须保持 ~/.beast/2.7/BEAST.base/<version>/lib/BEAST.base.jar 布局：
          # beast2py/beast2_validate.sh 只按这个 glob 定位 jar。
          # 先清空目标目录：若 2.7.7 已存在，`mv beast <dir>` 会把 beast 嵌成
          # 2.7.7/beast/，后续所有路径都错位。
          DEST="$HOME/.beast/2.7/BEAST.base/2.7.7"
          mkdir -p "$HOME/.beast/2.7/BEAST.base"
          rm -rf "$DEST"
          mv beast "$DEST"
          # tarball 里 jar 位于 lib/packages/BEAST.base.jar，而
          # beast2py/beast2_validate.sh 只按
          #   ~/.beast/2.7/BEAST.base/*/lib/BEAST.base.jar
          # 这个 glob 定位 jar，匹配不上会直接 exit 2
          # （"BEAST.base.jar not found."）。补一个符号链接对齐布局。
          if [ -f "$DEST/lib/packages/BEAST.base.jar" ] && [ ! -f "$DEST/lib/BEAST.base.jar" ]; then
            ln -s packages/BEAST.base.jar "$DEST/lib/BEAST.base.jar"
          fi
          ls -la "$DEST/lib/BEAST.base.jar"
          # 自带 JRE 可能不完整，显式确认可执行并打印真实错误而非 exit 127
          ls -la "$DEST/bin/beast"
          if ! "$DEST/bin/beast" -version; then
            echo "::error::BEAST 启动脚本无法执行，打印目录结构与 JRE 状态"
            ls -la "$DEST"
            ls -la "$DEST/jre/bin/java" 2>&1 || true
            exit 1
          fi

      - name: Upgrade BEAST.base to 2.7.8
        # 用包管理器升级 base 包，拿到 2.7.8 的实际代码变更；
        # 失败不阻断——下方 add-on 与测试步骤会各自可见地 skip/失败。
        run: |
          set -uo pipefail
          BEAST="$HOME/.beast/2.7/BEAST.base/2.7.7/bin/beast"
          "$BEAST" -get BEAST.base v2.7.8 \
            || echo "::warning::could not upgrade BEAST.base to v2.7.8; continuing on v2.7.7 runtime"

      - name: Install BEAST2 add-ons used by two examples (non-fatal)
        # config_bd_skyline.yaml and config_nested_sampling.yaml reference
        # bdsky.evolution.speciation.BirthDeathSkylineModel and
        # nestedsampling.gss.NS. Without the jars those two integration cases
        # SKIP (visible via -rs), which must never be read as a pass: the
        # add-on-dependent specs are otherwise unverified in CI.
        run: |
          BEAST="$HOME/.beast/2.7/BEAST.base/2.7.7/bin/beast"
          "$BEAST" -get BDSKY v1.5.1 || echo "::warning::BDSKY add-on not installed; bd_skyline example will be skipped"
          "$BEAST" -get NS || echo "::warning::nested-sampling add-on not installed; nested_sampling example will be skipped"
          ls ~/.beast/2.7 || true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run BEAST2 integration tests
        run: |
          pytest tests/test_beast2_validation.py -v -rs

  packaging:
    # The BEAST2 validation helper must be present after a
    # plain `pip install .`, otherwise validation silently degrades to
    # "executable not found" while the command still exits 0.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the distribution (not the source tree)
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
          python -m pip install dist/*.whl
      - name: Assert the bundled validator is discoverable
        run: |
          cd /tmp
          python - <<'PY'
          from beast2py.validator import XMLValidator
          path = XMLValidator._bundled_validator_script()
          assert path is not None and path.is_file(), (
              "beast2_validate.sh missing from the installed distribution"
          )
          print("validator script:", path)
          tools = path.parent / "tools" / "Beast2Validator.java"
          assert tools.is_file(), "tools/Beast2Validator.java missing from the wheel"
          PY
      - name: Assert the console entry point runs
        run: |
          cd /tmp
          beast2py list-models >/dev/null
