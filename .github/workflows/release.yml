name: Release

# Cutting a release was entirely manual: the repository had no release
# workflow, so building the sdist/wheel, attaching it to the GitHub release and
# keeping the version numbers in step were all done by hand. This workflow
# builds and attaches, and refuses to proceed when the version numbers in the
# tree disagree with the tag.
#
# Publishing to PyPI is included but conditional: it only runs when the
# `PYPI_PUBLISH` repository variable is set to `true`, and it authenticates via
# Trusted Publishing (OIDC) — no API token is stored in the repository — so it
# cannot break a release that is not yet configured for PyPI.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: verify version consistency
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: The tag, the package, the citation file and the Zenodo file must agree
        # A release currently has to bump the version in four separate places.
        # Nothing checked that they matched, so a release could ship a wheel
        # whose `beast2py.__version__` disagreed with its own tag.
        run: |
          set -euo pipefail
          python -m pip install --quiet pyyaml
          python - <<'PY'
          import json
          import os
          import pathlib
          import re
          import sys

          import yaml

          src = pathlib.Path("beast2py/__init__.py").read_text()
          match = re.search(r'__version__\s*=\s*["\']([^"\']+)["\']', src)
          if not match:
              print("::error::could not find __version__ in beast2py/__init__.py")
              sys.exit(1)
          pkg = match.group(1)

          cff = yaml.safe_load(pathlib.Path("CITATION.cff").read_text())["version"]
          zenodo = json.loads(pathlib.Path(".zenodo.json").read_text())["version"]

          found = {
              "beast2py.__version__": pkg,
              "CITATION.cff": cff,
              ".zenodo.json": zenodo,
          }
          # Only meaningful for a tag-triggered run; a manual dispatch has no
          # tag to compare against.
          if os.environ.get("GITHUB_REF_TYPE") == "tag":
              found["git tag"] = os.environ.get("GITHUB_REF_NAME", "").removeprefix("v")

          width = max(len(name) for name in found)
          for name, value in found.items():
              print(f"{name:<{width}} = {value}")

          mismatched = {n: v for n, v in found.items() if v != pkg}
          if mismatched:
              for name, value in mismatched.items():
                  print(f"::error::{name} is {value} but beast2py.__version__ is {pkg}")
              sys.exit(1)
          print("All version references agree.")
          PY

  build:
    name: build and attach distributions
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
          ls -l dist/

      - name: Check the distributions
        run: |
          set -euo pipefail
          python -m pip install --upgrade twine
          twine check --strict dist/*
          echo "--- sdist contents ---"
          tar -tzf dist/*.tar.gz | sort > /tmp/sdist.txt
          # The wheel is what users install, but the sdist is what a
          # distribution build or a downstream repackager reads, and the
          # LGPL notice for the vendored BEAST2 classes has to travel with
          # both.
          for expected in \
            LICENSE \
            CITATION.cff \
            beast2py/tools/NOTICE \
            beast2py/tools/LICENSE.BEAST2-LGPL-2.1.txt \
            beast2py/tools/Beast2Validator.java \
            beast2py/tools/launcher.jar; do
            # setuptools prefixes every sdist member with the versioned top
            # directory (beast2py-<version>/...), so the match must not anchor
            # to a literal "package/" prefix — anchor on a path boundary and
            # the end of the member name instead.
            if ! grep -qE "(^|/)${expected}\$" /tmp/sdist.txt; then
              echo "::error::$expected is missing from the sdist"
              exit 1
            fi
            echo "ok: $expected"
          done
          echo "--- precompiled validator classes in the sdist ---"
          # These are committed to the repository on purpose; confirm they are
          # actually in the sdist, because the validator falls back to running
          # the .java source only when they are absent.
          grep -c "beast2py/tools/classes/.*\.class" /tmp/sdist.txt

      - name: Attach the distributions to the GitHub release
        # Uses the runner's preinstalled `gh` rather than a third-party release
        # action, to keep the supply chain of the release path small.
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "Not a tag-triggered run; nothing to attach."
            exit 0
          fi
          # A tag push fires this run before any hand-made release exists, and
          # `gh release upload` fails on a missing release. The workflow owns
          # release creation: idempotently create it when absent, then upload.
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "Beast2Py $GITHUB_REF_NAME" \
              --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          echo "Attached to https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME"

      - name: Summarise what was released
        run: |
          {
            echo "## Distributions for \`$GITHUB_REF_NAME\`"
            echo
            echo "| File | Size | SHA256 |"
            echo "| --- | --- | --- |"
            for f in dist/*; do
              size="$(wc -c < "$f" | tr -d ' ')"
              sum="$(sha256sum "$f" | cut -d' ' -f1)"
              echo "| \`$(basename "$f")\` | $size bytes | \`$sum\` |"
            done
          } | tee release-summary.md
          echo
          echo "The release notes are left exactly as written; this summary is not"
          echo "written back over them, so a hand-written changelog section survives."

  pypi:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    # `id-token: write` is what lets the publish action mint an OIDC token for
    # PyPI Trusted Publishing. No API token is stored in this repository at
    # all; PyPI validates the token against the trusted-publisher entry that
    # must be registered on pypi.org for this repo, workflow and environment.
    permissions:
      contents: read
      id-token: write
    # Opt-in, keyed on a repository *variable*: GitHub rejects the entire
    # workflow file if `secrets` appears in any `if` expression, at job level
    # or step level. Only github / needs / vars / inputs are available there.
    #
    # To enable: register this repo as a trusted publisher on pypi.org
    # (owner ZengZichao, repo Beast2Py, workflow release.yml, environment
    # pypi), then set the repository variable PYPI_PUBLISH=true. See
    # CONTRIBUTING.md.
    if: ${{ vars.PYPI_PUBLISH == 'true' }}
    steps:
      # Rebuilt from the same tag rather than downloaded as an artifact: the
      # sdist and wheel must correspond to the source in this ref, and
      # threading a build artifact between jobs would be the only place where
      # what gets published could differ from what the build job verified.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Rebuild
        run: |
          python -m pip install --upgrade pip build
          python -m build
      # This is the publish path, so the action is pinned to a commit SHA
      # rather than the mutable `release/v1` branch ref. Without a `password`
      # input it uses Trusted Publishing (OIDC) by default.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  pypi-not-enabled:
    name: report that PyPI publishing is not enabled
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ vars.PYPI_PUBLISH != 'true' }}
    steps:
      # Beast2Py has never been published to PyPI, and this must never be the
      # reason a release fails. A dedicated job rather than a conditional step
      # keeps the notice visible in the run list.
      - name: Report that PyPI publishing is not enabled
        run: |
          echo "::notice title=PyPI publishing skipped::The repository variable PYPI_PUBLISH is not"
          echo "::notice::set to 'true', so nothing was uploaded to PyPI. The GitHub release was"
          echo "::notice::still created by the build job. Publishing is on the project roadmap; see"
          echo "::notice::CONTRIBUTING.md for how to enable it."


