# ============================================================
# Beast2Py 示例配置文件 9 / Example configuration 9
# UC 指数松弛时钟（UCE）+ GTR+Γ4 + Yule
# Uncorrelated relaxed *exponential* clock (UCE).
#
# 说明 / Notes
# ----
# * gamma_shape carries `estimate: false`, i.e. it stays a constant at 0.5 and
#   is written inline as <parameter estimate="false">: it never becomes a
#   state node, gets no operator and does not appear in the trace.  Quoting
#   the flag (`estimate: "false"`) is a hard parse error on purpose -- Python
#   truthiness used to turn that string into True.
# * With the root calibrated the absolute scale no longer depends on the
#   clock rate alone, which is what makes the relaxed rates interpretable.
# ============================================================

metadata:
  analysis_name: "primates_relaxed_exponential"
  analysis_description: "GTR + uncorrelated relaxed exponential clock"
  author: "Beast2Py"
  date: "2026-08-01"
  beast2_version: "2.7.7"
  tool_version: "0.2.0"

alignments:
  - id: "alignment"
    file: "primates.fasta"
    format: "auto"
    data_type: "nucleotide"

partitions:
  - id: "alignment"
    site_model:
      substitution_model:
        type: "gtr"
        rateAC: {value: 1.0, lower: 0.0}
        rateAG: {value: 4.0, lower: 0.0}
        rateAT: {value: 1.0, lower: 0.0}
        rateCG: {value: 1.0, lower: 0.0}
        rateCT: {value: 4.0, lower: 0.0}
        rateGT: {value: 1.0, lower: 0.0}
        frequencies: {value: 0.25, dimension: 4, lower: 0.0, upper: 1.0}
      gamma_categories: 4
      gamma_shape: {value: 0.5, lower: 0.0, upper: 10.0, estimate: false}
    clock_model:
      type: "uce"
      ucld_mean: {value: 1.0, lower: 0.0}
      ucld_stdev: {value: 0.5, lower: 0.0, upper: 1.0}
    tree: "shared"

tree_prior:
  type: "yule"
  birth_rate: {value: 1.0, lower: 0.0}

calibrations:
  # Root of this alignment = Strepsirrhini vs Haplorhini (Lemur_catta vs the
  # rest): a young root would conflict with the synthetic nested calibrations.
  # Synthetic root calibration: exponential
  # mean 2.5 above offset 50.0; illustrative only.
  - name: "primateRoot"
    taxa: null
    monophyletic: true
    distribution:
      type: "exponential"
      parameters: {mean: 2.5}
      offset: 50.0
    provenance:
      source: "other"
      reference: "Synthetic example data generated for Beast2Py documentation and testing; not derived from any publication or empirical dataset."
      calibration_type: "soft"
      original_age_min: 50.0
      original_age_max: 60.0
      notes: "Synthetic calibration card for the primateRoot example node. The distribution, offset and age bracket are invented for demonstration and testing; they are not derived from any fossil, publication, or empirical dataset. The values are expressed in Ma and exist only to exercise the provenance fields, XML generation and diagnostics."
  - name: "homininaMRCA"
    taxa: ["Homo_sapiens", "Pan"]
    monophyletic: true
    distribution:
      type: "lognormal"
      parameters: {M: 0.2, S: 0.35}
      offset: 5.0
    provenance:
      source: "other"
      reference: "Synthetic example data generated for Beast2Py documentation and testing; not derived from any publication or empirical dataset."
      calibration_type: "soft"
      original_age_min: 5.0
      original_age_max: 6.0
      notes: "Synthetic calibration card for the homininaMRCA example node. The distribution, offset and age bracket are invented for demonstration and testing; they are not derived from any fossil, publication, or empirical dataset. The values are expressed in Ma and exist only to exercise the provenance fields, XML generation and diagnostics."

mcmc:
  type: "standard"
  chain_length: 10000000
  store_every: 10000

loggers:
  trace_log:
    file_name: "primates_uce.$(seed).log"
    log_every: 1000
  tree_log:
    file_name: "primates_uce.$(seed).trees"
    log_every: 1000
  screen_log:
    log_every: 10000

initialization:
  tree_type: "random"

output:
  file: "primates_uce.xml"
  embed_fingerprint: true
