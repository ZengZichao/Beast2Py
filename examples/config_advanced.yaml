# ============================================================
# Beast2Py 示例配置文件 2 / Example configuration 2
# 高级场景：多 partition + GTR+Γ+I + UCLN + Birth-Death + 多校准 + 超先验
# 展示多 partition link/unlink、松弛时钟、多 MRCA 校准、超先验、诊断阈值
#
# 说明 / Notes
# ----
# * 两个 partition 来自同一比对的**互不相交**的密码子位点（codon12 = 599 sites，
#   codon3 = 299 sites）。把同一份 898 位点原样复制成 gene1/gene2 会让同一批
#   位点被计进似然两次——后验等于把自己乘两遍，是过度自信的后验而不是更锐的
#   后验。解析器现在拒绝两个 partition 指向同一个 file-backed alignment。
# * 这里 site model 与 clock 都用 linked_to 链接到 codon12（"全链接"写法）；
#   只链接时钟、不链接取代模型的场景见 config_multi_partition.yaml。
# * hyperpriors：lognormal 校准的 S（对数尺度形状参数）本身作为待估参数，
#   给它一个 LogNormal(median 0.4, S=0.3) 先验。
#   键名必须是该分布**真实存在**的参数名（lognormal -> M/S），否则会报错。
# * 根校准：过小的根年龄对这份比对不合适——它的根是 Strepsirrhini vs
#   Haplorhini（Lemur_catta vs 其余）。三个虚拟校准演示嵌套次序：
#   exponential mean 2.5 offset 50.0；区间依次为 Hominina 5-6 Ma、
#   Hominidae 10-20 Ma、root 50-60 Ma。
# ============================================================

metadata:
  analysis_name: "primates_advanced_multicalibration"
  analysis_description: "Advanced multi-partition analysis with UCLN clock and multiple calibrations"
  author: "Beast2Py"
  date: "2026-08-01"
  beast2_version: "2.7.7"
  tool_version: "0.2.0"

# --- 序列数据（母本比对 + 两个互不相交的密码子分区） ---
alignments:
  - id: "gene1"
    file: "primates.fasta"
    format: "auto"
    data_type: "nucleotide"

  - id: "codon12"
    file: "primates.fasta"
    format: "auto"
    data_type: "nucleotide"
    filter: "1::3,2::3"
    data_id: "gene1"

  - id: "codon3"
    file: "primates.fasta"
    format: "auto"
    data_type: "nucleotide"
    filter: "3::3"
    data_id: "gene1"

# --- Partition 模型配置 ---
partitions:
  - id: "codon12"
    site_model:
      substitution_model:
        type: "gtr"
        rateAC: {value: 1.0, lower: 0.0}
        rateAG: {value: 4.0, lower: 0.0}
        rateAT: {value: 1.0, lower: 0.0}
        rateCG: {value: 1.0, lower: 0.0}
        rateCT: {value: 4.0, lower: 0.0}
        rateGT: {value: 1.0, lower: 0.0}
        frequencies: {value: 0.25, dimension: 4, lower: 0.0, upper: 1.0, estimate: true}
      gamma_categories: 4
      gamma_shape: {value: 0.5, lower: 0.0}
      proportion_invariant: {value: 0.01, lower: 0.0, upper: 1.0}
    clock_model:
      type: "ucln"
      ucld_mean: {value: 1.0, lower: 0.0}
      ucld_stdev: {value: 0.5, lower: 0.0, upper: 1.0}
    tree: "shared"

  - id: "codon3"
    site_model:
      linked_to: "codon12"     # 与 codon12 共享位点模型（link）
    clock_model:
      type: "ucln"
      linked_to: "codon12"     # 共享时钟（link）
    tree: "shared"

# --- 树先验 ---
tree_prior:
  type: "birth_death"
  birth_rate: {value: 1.0, lower: 0.0}
  death_rate: {value: 0.5, lower: 0.0}
  sample_probability: {value: 1.0, lower: 0.0, upper: 1.0}

# --- 校准点（多个，含嵌套关系） ---
calibrations:
  - name: "homininaMRCA"
    taxa: ["Homo_sapiens", "Pan"]
    monophyletic: true
    distribution:
      type: "lognormal"
      parameters: {M: 0.2, S: 0.35}
      offset: 5.0
      # sigma 的超先验演示：这里估计 lognormal 的 S（对数尺度形状参数），
      # 其自身服从 LogNormal(median 0.4, S=0.3)。键名必须是该分布真实存在的
      # 参数名（lognormal -> M/S），否则解析期报错。
      hyperpriors:
        S:
          type: "lognormal"
          parameters: {M: -0.916, S: 0.3}
    provenance:
      source: "other"
      reference: "Synthetic example data generated for Beast2Py documentation and testing; not derived from any publication or empirical dataset."
      calibration_type: "soft"
      original_age_min: 5.0
      original_age_max: 6.0
      notes: "Synthetic calibration card for the homininaMRCA example node. The distribution, offset and age bracket are invented for demonstration and testing; they are not derived from any fossil, publication, or empirical dataset. The values are expressed in Ma and exist only to exercise the provenance fields, XML generation and diagnostics."
  - name: "hominidaeMRCA"
    taxa: ["Homo_sapiens", "Pan", "Gorilla", "Pongo"]
    monophyletic: true
    distribution:
      type: "exponential"
      parameters: {mean: 2.0}
      offset: 10.0
    provenance:
      source: "other"
      reference: "Synthetic example data generated for Beast2Py documentation and testing; not derived from any publication or empirical dataset."
      calibration_type: "soft"
      original_age_min: 10.0
      original_age_max: 20.0
      notes: "Synthetic calibration card for the hominidaeMRCA example node. The distribution, offset and age bracket are invented for demonstration and testing; they are not derived from any fossil, publication, or empirical dataset. The values are expressed in Ma and exist only to exercise the provenance fields, XML generation and diagnostics."
  - name: "primateRoot"
    taxa: null
    monophyletic: true
    distribution:
      type: "exponential"
      parameters: {mean: 2.5}
      offset: 50.0
    provenance:
      source: "other"
      reference: "Synthetic example data generated for Beast2Py documentation and testing; not derived from any publication or empirical dataset."
      calibration_type: "soft"
      original_age_min: 50.0
      original_age_max: 60.0
      notes: "Synthetic calibration card for the primateRoot example node. The distribution, offset and age bracket are invented for demonstration and testing; they are not derived from any fossil, publication, or empirical dataset. The values are expressed in Ma and exist only to exercise the provenance fields, XML generation and diagnostics."

# --- 参数先验 ---
# These name the *derived* state nodes of the BirthDeathGernhard08Model
# (birth - death and death / birth), which is what the priors must attach to;
# priors written against "birth_rate"/"death_rate" are resolved through the
# alias table, and a name that matches nothing is an error.
parameter_priors:
  - parameter: "birthDiffRate"
    distribution:
      type: "uniform"
      parameters: {lower: 0.0, upper: 10.0}
  - parameter: "relativeDeathRate"
    distribution:
      type: "uniform"
      parameters: {lower: 0.0, upper: 1.0}

# --- 诊断设置（beast2py diagnose / generate 的第 2 道闸门） ---
# 结构性冲突（同一节点、嵌套时间顺序、相交非嵌套拓扑）始终检查并可能阻断；
# prior_similarity 是**非诊断性**描述，默认关闭。若要查看两个先验的密度相似度，
# 必须显式给出阈值，例如：
#   prior_similarity: true
#   similarity_measure: "relative"   # relative | absolute | both
#   similarity_threshold: 0.05       # 纯占位写法示例；该数值未经灵敏度/特异度标定，采用前须自行论证
# 该输出不会建议合并校准，也不参与 Gate 2 阻断。strict_distributions: true 会把
# Beta(无 offset)/Poisson/OneOnX 等不适用于连续节点年龄的分布升级为错误。
diagnostics:
  prior_similarity: false
  strict_distributions: false

# --- MCMC ---
mcmc:
  type: "standard"
  chain_length: 50000000
  pre_burnin: 0
  store_every: 50000

# --- 日志器 ---
loggers:
  trace_log:
    file_name: "primates_advanced.$(seed).log"
    log_every: 5000
  tree_log:
    file_name: "primates_advanced.$(seed).trees"
    log_every: 5000
  screen_log:
    log_every: 10000

# --- 初始化 ---
initialization:
  tree_type: "random"

# --- 输出 ---
output:
  file: "primates_advanced.xml"
  embed_fingerprint: true
