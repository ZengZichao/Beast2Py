# ============================================================
# Beast2Py 示例配置文件 10 / Example configuration 10
# 随机局部时钟（Random Local Clock, RLC）+ HKY+Γ4 + Yule
#
# 说明 / Notes
# ----
# * The RLC puts a discrete <rateCategories> parameter on the branches (one
#   integer per branch, drawn from the Dirichlet-rooted rateprior) and is
#   therefore moved by a discrete operator, not by a scale operator.
# * No `ucld_mean` / `ucld_stdev` is needed: the local rates themselves are
#   the clock parameters, so the clock rate carries the absolute scale only
#   once a calibration pins it (here: the Hominina soft minimum).
# ============================================================

metadata:
  analysis_name: "primates_random_local_clock"
  analysis_description: "Random local clock model with HKY"
  author: "Beast2Py"
  date: "2026-08-01"
  beast2_version: "2.7.7"
  tool_version: "0.2.0"

alignments:
  - id: "alignment"
    file: "primates.fasta"
    format: "auto"
    data_type: "nucleotide"

partitions:
  - id: "alignment"
    site_model:
      substitution_model:
        type: "hky"
        kappa: {value: 2.0, lower: 0.0}
        frequencies: {value: 0.25, dimension: 4, lower: 0.0, upper: 1.0, estimate: true}
      gamma_categories: 4
      gamma_shape: {value: 0.5, lower: 0.0}
    clock_model:
      type: "rlc"
      clock_rate: {value: 1.0, lower: 0.0}
    tree: "shared"

tree_prior:
  type: "yule"
  birth_rate: {value: 1.0, lower: 0.0}

calibrations:
  # Synthetic lognormal(M=0.2, S=0.35) offset 5.0; illustrative only.
  # (checked with beast2py.utils.compute_distribution_stats).
  - name: "homininaMRCA"
    taxa: ["Homo_sapiens", "Pan"]
    monophyletic: true
    distribution:
      type: "lognormal"
      parameters: {M: 0.2, S: 0.35}
      offset: 5.0
    provenance:
      source: "other"
      reference: "Synthetic example data generated for Beast2Py documentation and testing; not derived from any publication or empirical dataset."
      calibration_type: "soft"
      original_age_min: 5.0
      original_age_max: 6.0
      notes: "Synthetic calibration card for the homininaMRCA example node. The distribution, offset and age bracket are invented for demonstration and testing; they are not derived from any fossil, publication, or empirical dataset. The values are expressed in Ma and exist only to exercise the provenance fields, XML generation and diagnostics."

mcmc:
  type: "standard"
  chain_length: 10000000
  store_every: 10000

loggers:
  trace_log:
    file_name: "primates_rlc.$(seed).log"
    log_every: 1000
  tree_log:
    file_name: "primates_rlc.$(seed).trees"
    log_every: 1000
  screen_log:
    log_every: 10000

initialization:
  tree_type: "random"

output:
  file: "primates_rlc.xml"
  embed_fingerprint: true
