# ============================================================
# Beast2Py 示例配置文件 8a / Example configuration 8a
# 替换模型：JC69（最简模型；用于与 TVM/HKY 做边际似然比较）
# JC69: one model per run -- see config_subst_models.yaml for why.
#
# 说明 / Notes
# ----
# * JC69 (spec="JukesCantor") has no exchangeability parameters and no
#   frequency parameters: all six rates are equal and all four equilibrium
#   frequencies are 1/4 by construction.  Therefore this file carries neither
#   `rates` nor `frequencies` under substitution_model, and no <frequencies>
#   element appears in the XML.  Writing `rates:` here is a parse error, and a
#   stray `frequencies:` key would be dead weight.
# Gamma rate heterogeneity is what makes this model useful on simulated mtDNA
#   data; with gamma_categories: 0 the shape parameter would be ignored by
#   BEAST2, so Beast2Py refuses `gamma_shape` unless gamma_categories > 1.
# ============================================================

metadata:
  analysis_name: "primates_subst_jc69"
  analysis_description: "JC69 + Gamma, single partition, for marginal-likelihood model comparison"
  author: "Beast2Py"
  date: "2026-08-01"
  beast2_version: "2.7.7"
  tool_version: "0.2.0"

alignments:
  - id: "alignment"
    file: "primates.fasta"
    format: "auto"
    data_type: "nucleotide"

partitions:
  - id: "alignment"
    site_model:
      substitution_model:
        type: "jc69"
      gamma_categories: 4
      gamma_shape: {value: 0.5, lower: 0.0}
    clock_model:
      type: "strict"
      clock_rate: {value: 1.0, lower: 0.0}   # estimated
    tree: "shared"

tree_prior:
  type: "yule"
  birth_rate: {value: 1.0, lower: 0.0}

calibrations:
  # Synthetic lognormal(M=0.2, S=0.35) offset 5.0; illustrative only.
  - name: "homininaMRCA"
    taxa: ["Homo_sapiens", "Pan"]
    monophyletic: true
    distribution:
      type: "lognormal"
      parameters: {M: 0.2, S: 0.35}
      offset: 5.0
    provenance:
      source: "other"
      reference: "Synthetic example data generated for Beast2Py documentation and testing; not derived from any publication or empirical dataset."
      calibration_type: "soft"
      original_age_min: 5.0
      original_age_max: 6.0
      notes: "Synthetic calibration card for the homininaMRCA example node. The distribution, offset and age bracket are invented for demonstration and testing; they are not derived from any fossil, publication, or empirical dataset. The values are expressed in Ma and exist only to exercise the provenance fields, XML generation and diagnostics."

mcmc:
  type: "standard"
  chain_length: 10000000
  store_every: 10000

loggers:
  trace_log:
    file_name: "primates_jc69.$(seed).log"
    log_every: 1000
  tree_log:
    file_name: "primates_jc69.$(seed).trees"
    log_every: 1000
  screen_log:
    log_every: 10000

initialization:
  tree_type: "random"

output:
  file: "primates_jc69.xml"
  embed_fingerprint: true
