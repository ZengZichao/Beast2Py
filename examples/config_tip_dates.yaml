# ============================================================
# Beast2Py 示例配置文件 3 / Example configuration 3
# 末端日期场景：TraitSet 采样日期 + Birth-Death + HKY + UCLN
# Tip dates: a TraitSet of sampling dates attached to the tree.
# 对标 BEAST2 examples/testTipDates.xml（下面的说明解释为何示例日期全为 0）
#
# 说明 / Notes（三条容易被静默写错的规则）
# ----
# 1. tip_dates.dates 必须覆盖比对中的**每一个** taxon。未命名的末端会被
#    BEAST2 当作 0（今世样本），三条最深层系会在用户不知情时变成今世样本；
#    解析器现在直接报错并列出缺失的 taxon。
# 2. trait_name 只能是 date-forward / date-backward；写成 date_backward 会
#    产出一份"能被解析、但 BEAST2 从不把它当日期"的合法 XML。
# 3. **整个分析只有一条时间轴**。末端日期以 year 为单位，所以校准先验和时钟
#    速率也必须以 year 为单位：示例校准用 5 000 000 year 的 offset；
#    时钟速率与末端日期共用 year 单位，不再换算 Ma 尺度。
#
# 末端日期为何全为 0 / Why every date below is 0
# ----
# 这是示例设定，不是能力限制：primates.fasta 的 12 条序列均为虚拟构造的现生
# 序列，因此 date-backward 全为 0 是合适的写法——BEAST2 由此得到“所有末端在
# 同一时刻”，绝对时间轴完全由校准点决定。
# 真正的异时采样数据（古 DNA、亚化石）可以走同一条路径：把若干末端日期改为非 0
# 后，本版本（0.1.2）生成的 TipDatesRandomWalker 由 BEAST2 v2.7.8 解析并初始化
# 通过（2026-10-08 实测：两个非 0 日期的变体，gate 3 pass）。
# 早先版本曾在 <taxonset> 里同时给出 alignment= 与 <taxon> 子节点，BEAST2 会以
#   "Only one of taxon and alignment should be specified, not both
#    (id=tipdates.taxonset)"
# 拒绝；该写法已由 model.py 的 build_operators 末端日期分支改为只发 idref 子节点。
# 本例保持全 0 只是为了让示例与数据本身一致，并不是因为异时采样不能生成。
#
# ============================================================

metadata:
  analysis_name: "primates_tip_dates"
  analysis_description: "Tip-dated (TraitSet) analysis of a contemporaneous primate sample"
  author: "Beast2Py"
  date: "2026-08-01"
  beast2_version: "2.7.7"
  tool_version: "0.2.0"

alignments:
  - id: "alignment"
    file: "primates.fasta"
    format: "auto"
    data_type: "nucleotide"

partitions:
  - id: "alignment"
    site_model:
      substitution_model:
        type: "hky"
        kappa: {value: 2.0, lower: 0.0}
        frequencies: {value: 0.25, dimension: 4, lower: 0.0, upper: 1.0, estimate: true}
      gamma_categories: 0
    clock_model:
      type: "ucln"
      ucld_mean: {value: 0.000002, lower: 0.0}   # 2e-6 subs/site/year: years axis
      ucld_stdev: {value: 0.5, lower: 0.0, upper: 1.0}
    tree: "shared"

# --- 末端日期（date-backward = 距今年数；0 = 今世样本） ---
tip_dates:
  enabled: true
  trait_name: "date-backward"
  units: "year"
  dates:
    # All 12 sequences are extant samples, so 0 years before present is the
    # value that states what is true rather than one that exercises the writer.
    Homo_sapiens: 0
    Pan: 0
    Gorilla: 0
    Pongo: 0
    Hylobates: 0
    Macaca_fuscata: 0
    M_mulatta: 0
    M_fascicularis: 0
    M_sylvanus: 0
    Saimiri_sciureus: 0
    Tarsius_syrichta: 0
    Lemur_catta: 0

# --- 树先验：物种级数据用生灭先验，而不是 coalescent ---
tree_prior:
  type: "birth_death"
  birth_rate: {value: 1.0, lower: 0.0}
  death_rate: {value: 0.5, lower: 0.0}
  sample_probability: {value: 1.0, lower: 0.0, upper: 1.0}

# --- 校准点：与末端日期同一条数轴（year） ---
# The offset shifts the distribution and M/S describe the lognormal *above* the
# offset, in the axis units, so M = 14.0 here; in Ma units the
# same shape is M = 0.2.  Checked with
#   compute_distribution_stats("lognormal", {M: 14.0, S: 0.35}, 5000000)
# -> illustrative prior only (synthetic values).
calibrations:
  - name: "homininaMRCA"
    taxa: ["Homo_sapiens", "Pan"]
    monophyletic: true
    distribution:
      type: "lognormal"
      parameters: {M: 14.0, S: 0.35}
      offset: 5000000.0
    provenance:
      source: "other"
      reference: "Synthetic example data generated for Beast2Py documentation and testing; not derived from any publication or empirical dataset."
      calibration_type: "soft"
      original_age_min: 5000000.0
      original_age_max: 6000000.0
      notes: "Synthetic calibration card for the homininaMRCA example node. The distribution, offset and age bracket are invented for demonstration and testing; they are not derived from any fossil, publication, or empirical dataset. The values are expressed in years and exist only to exercise the provenance fields, XML generation and diagnostics."

mcmc:
  type: "standard"
  chain_length: 10000000
  store_every: 10000

loggers:
  trace_log:
    file_name: "primates_tipdates.$(seed).log"
    log_every: 1000
  tree_log:
    file_name: "primates_tipdates.$(seed).trees"
    log_every: 1000
  screen_log:
    log_every: 10000

initialization:
  tree_type: "random"

output:
  file: "primates_tipdates.xml"
  embed_fingerprint: true
