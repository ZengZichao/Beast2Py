# ============================================================
# Beast2Py 示例配置文件 14 / Example configuration 14
# 氨基酸替换模型（WAG 经验矩阵，自带平衡频率）+ 两个 MRCA 校准
# Amino-acid data under the empirical WAG matrix, UCLN clock.
#
# 说明 / Notes
# ----
# * WAG (and JTT/Dayhoff/Blosum62/CPREV/MTREV) is a 20 x 20 empirical matrix
#   that ships with its own equilibrium frequencies, so no <frequencies> element
#   is generated -- and it is only legal on `data_type: aminoacid`, which the
#   parser now enforces in both directions (a nucleotide model on amino-acid
#   data, or WAG on ACGT data, is a parse error).
# * A calibration's taxon list must be a clade of the *real* tree, because
#   `monophyletic: true` becomes an MRCAPrior constraint that the topology has
#   to satisfy.  This alignment (examples/aminoacid.fasta, 10 taxa) holds six
#   mammals -- Cow, Human, Mouse, Rat, Seal, Whale -- so a "mammal root" on
#   [Cow, Mouse, Rat] would exclude Human/Seal/Whale and constrain away the
#   true topology.  All six are listed below.
# * A Laplace prior on a node age is unusual (it has support below zero once
#   offset and its density peaks with heavy symmetric tails); the age of a
#   clade is a positive quantity, so a lognormal soft minimum is used instead.
# ============================================================

metadata:
  analysis_name: "mito_aminoacid_wag"
  analysis_description: "Amino acid alignment under WAG with two MRCA calibrations"
  author: "Beast2Py"
  date: "2026-08-01"
  beast2_version: "2.7.7"
  tool_version: "0.2.0"

alignments:
  - id: "alignment"
    file: "aminoacid.fasta"
    format: "auto"
    data_type: "aminoacid"

partitions:
  - id: "alignment"
    site_model:
      substitution_model:
        type: "wag"
      gamma_categories: 4
      gamma_shape: {value: 1.0, lower: 0.0}
    clock_model:
      type: "ucln"
      ucld_mean: {value: 0.001, lower: 0.0}      # ~1e-3 subs/site/Myr for proteins
      ucld_stdev: {value: 0.5, lower: 0.0, upper: 1.0}
    tree: "shared"

tree_prior:
  type: "birth_death"
  birth_rate: {value: 1.0, lower: 0.0}
  death_rate: {value: 0.5, lower: 0.0}
  sample_probability: {value: 1.0, lower: 0.0, upper: 1.0}

calibrations:
  # Boreoeutheria (the six mammals of this alignment).  lognormal(M=2.5, S=0.5)
  # Synthetic calibration for crown Boreoeutheria; the prior and age bracket
  # are invented for this example and are not derived from any publication or
  # empirical dataset.
  - name: "boreoeutherianMRCA"
    taxa: ["Cow", "Human", "Mouse", "Rat", "Seal", "Whale"]
    monophyletic: true
    distribution:
      type: "lognormal"
      parameters: {M: 2.5, S: 0.5}
      offset: 60.0
    provenance:
      source: "other"
      reference: "Synthetic example data generated for Beast2Py documentation and testing; not derived from any publication or empirical dataset."
      calibration_type: "soft"
      original_age_min: 60.0
      original_age_max: 150.0
      notes: "Synthetic calibration card for the boreoeutherianMRCA example node. The distribution, offset and age bracket are invented for demonstration and testing; they are not derived from any fossil, publication, or empirical dataset. The values are expressed in Ma and exist only to exercise the provenance fields, XML generation and diagnostics."
  - name: "rodentMRCA"
    taxa: ["Mouse", "Rat"]
    monophyletic: true
    distribution:
      type: "lognormal"
      parameters: {M: 0.7, S: 0.25}
      offset: 10.0
    provenance:
      source: "other"
      reference: "Synthetic example data generated for Beast2Py documentation and testing; not derived from any publication or empirical dataset."
      calibration_type: "soft"
      original_age_min: 10.0
      original_age_max: 15.0
      notes: "Synthetic calibration card for the rodentMRCA example node. The distribution, offset and age bracket are invented for demonstration and testing; they are not derived from any fossil, publication, or empirical dataset. The values are expressed in Ma and exist only to exercise the provenance fields, XML generation and diagnostics."

mcmc:
  type: "standard"
  chain_length: 10000000
  store_every: 10000

loggers:
  trace_log:
    file_name: "aa_wag.$(seed).log"
    log_every: 1000
  tree_log:
    file_name: "aa_wag.$(seed).trees"
    log_every: 1000
  screen_log:
    log_every: 10000

initialization:
  tree_type: "random"

output:
  file: "aa_wag.xml"
  embed_fingerprint: true
