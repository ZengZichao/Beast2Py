# ============================================================
# Beast2Py 示例配置文件 4 / Example configuration 4
# CalibratedYule 场景：把校准直接整合进树先验
# CalibratedYule: the calibration densities become part of the tree prior
# instead of being added as independent MRCAPrior distributions.
#
# 说明 / Notes
# ----
# * With `calibration_method: calibrated_yule` the calibrations below are
#   written as <calibrations spec="CalibrationPoint"> children of
#   CalibratedYuleModel and are NOT also added to the prior compound, so a
#   node's calibration density
# * CalibratedYule needs a calibration on the root clade; the root point below
#   is a crown (root) calibration. A stem calibration would need a non-root
#   clade, because the root has no parent node (root + originate is rejected).
# * The primate calibration panel is shared with the other primates
#   examples; every prior was checked with the tool's own
#   compute_distribution_stats() and the median + 95% HPD quoted in the
#   comments is what the generated XML implies.
# ============================================================

metadata:
  analysis_name: "primates_calibrated_yule"
  analysis_description: "CalibratedYule model integrating calibration into tree prior"
  author: "Beast2Py"
  date: "2026-08-01"
  beast2_version: "2.7.7"
  tool_version: "0.2.0"

alignments:
  - id: "alignment"
    file: "primates.fasta"
    format: "auto"
    data_type: "nucleotide"

partitions:
  - id: "alignment"
    site_model:
      substitution_model:
        type: "hky"
        kappa: {value: 2.0, lower: 0.0}
        frequencies: {value: 0.25, dimension: 4, lower: 0.0, upper: 1.0, estimate: true}
      gamma_categories: 4
      gamma_shape: {value: 0.5, lower: 0.0}
    clock_model:
      type: "strict"
      clock_rate: {value: 1.0, lower: 0.0}
    tree: "shared"

# --- CalibratedYule 树先验 ---
tree_prior:
  type: "calibrated_yule"
  birth_rate: {value: 1.0, lower: 0.0}

# --- 校准方法选择：把校准并入树先验，而不是独立的 MRCAPrior ---
calibration_method: "calibrated_yule"

# --- 校准点（用于 CalibratedYuleModel 的 CalibrationPoint） ---
calibrations:
  # Synthetic Homo-Pan calibration; values are illustrative only.
  - name: "homininaMRCA"
    taxa: ["Homo_sapiens", "Pan"]
    monophyletic: true
    distribution:
      type: "lognormal"
      parameters: {M: 0.2, S: 0.35}
      offset: 5.0
    provenance:
      source: "other"
      reference: "Synthetic example data generated for Beast2Py documentation and testing; not derived from any publication or empirical dataset."
      calibration_type: "soft"
      original_age_min: 5.0
      original_age_max: 6.0
      notes: "Synthetic calibration card for the homininaMRCA example node. The distribution, offset and age bracket are invented for demonstration and testing; they are not derived from any fossil, publication, or empirical dataset. The values are expressed in Ma and exist only to exercise the provenance fields, XML generation and diagnostics."
  - name: "hominidaeMRCA"
    taxa: ["Homo_sapiens", "Pan", "Gorilla", "Pongo"]
    monophyletic: true
    distribution:
      type: "exponential"
      parameters: {mean: 2.0}
      offset: 10.0
    provenance:
      source: "other"
      reference: "Synthetic example data generated for Beast2Py documentation and testing; not derived from any publication or empirical dataset."
      calibration_type: "soft"
      original_age_min: 10.0
      original_age_max: 20.0
      notes: "Synthetic calibration card for the hominidaeMRCA example node. The distribution, offset and age bracket are invented for demonstration and testing; they are not derived from any fossil, publication, or empirical dataset. The values are expressed in Ma and exist only to exercise the provenance fields, XML generation and diagnostics."
  - name: "primateRoot"
    taxa: null
    monophyletic: true
    distribution:
      type: "exponential"
      parameters: {mean: 2.5}
      offset: 50.0
    provenance:
      source: "other"
      reference: "Synthetic example data generated for Beast2Py documentation and testing; not derived from any publication or empirical dataset."
      calibration_type: "soft"
      original_age_min: 50.0
      original_age_max: 60.0
      notes: "Synthetic calibration card for the primateRoot example node. The distribution, offset and age bracket are invented for demonstration and testing; they are not derived from any fossil, publication, or empirical dataset. The values are expressed in Ma and exist only to exercise the provenance fields, XML generation and diagnostics."

mcmc:
  type: "standard"
  chain_length: 10000000
  pre_burnin: 0
  store_every: 10000

loggers:
  trace_log:
    file_name: "primates_cyule.$(seed).log"
    log_every: 1000
  tree_log:
    file_name: "primates_cyule.$(seed).trees"
    log_every: 1000
  screen_log:
    log_every: 10000

initialization:
  # UPGMA 起始树高度为遗传距离量级，无法容纳 Ma 级校准点
  # （校准节点会高于根节点，导致 BEAST2 无法初始化）；含校准的配置建议 random。
  tree_type: "random"

output:
  file: "primates_cyule.xml"
  embed_fingerprint: true
